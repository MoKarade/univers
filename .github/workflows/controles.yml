# T1 (mission 1) : chaque proposition de changement construit la page et lance les tests de calcul.
# Commande exigée par docs/mission-lot1.md, reprise telle quelle dans la dernière étape.
name: Contrôles

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Une nouvelle poussée annule le contrôle en cours sur la même branche (minutes comptées).
concurrency:
  group: controles-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  construire-et-tester:
    name: Construire la page et tester les calculs
    runs-on: ubuntu-latest
    # Plafond : sans lui, un contrôle figé tourne six heures.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Construire puis tester
        shell: bash
        run: python3 app/build.py && for f in app/test/*.test.js; do echo "== $f"; node "$f" || exit 1; done
      - name: Plus de fondu daté pour les planètes (R7)
        shell: bash
        run: "! grep -rn FATE_P app/src"

  # T1 (revue 18/11) : la physique native (sans Vulkan ni windows.h) compile et ses essais sans données tournent sous Linux.
  # Les essais qui lisent un film ou DE440 sont seulement compilés : leurs fichiers restent sur le PC de Marc.
  physique-native:
    name: Physique native (compilation et essai des orbites)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compiler
        shell: bash
        run: |
          # natif/physique n'est pas un projet CMake autonome (natif/CMakeLists.txt l'inclut) : petite enveloppe.
          mkdir -p ci-physique
          printf '%s\n' 'cmake_minimum_required(VERSION 3.20)' 'project(physique CXX)' 'set(CMAKE_CXX_STANDARD 20)' \
            'set(CMAKE_CXX_STANDARD_REQUIRED ON)' 'add_subdirectory(${CMAKE_SOURCE_DIR}/../natif/physique physique)' > ci-physique/CMakeLists.txt
          cmake -S ci-physique -B build-physique -DCMAKE_BUILD_TYPE=Release
          cmake --build build-physique -j 4 --target essai_galaxie essai_fusion essai_champ_bfe essai_film essai_film_v3
      - name: Shaders (GLSL -> SPIR-V, comme la construction Windows)
        shell: bash
        run: |
          sudo apt-get install -y -qq glslang-tools >/dev/null
          for f in natif/shaders/*.vert natif/shaders/*.frag natif/shaders/*.comp; do glslang -V --quiet -Inatif/shaders "$f" -o /dev/null || exit 1; done
      - name: Orbites des étoiles (essai_galaxie)
        shell: bash
        run: ./build-physique/physique/essai_galaxie
      - name: Lecteur du film version 3 (essai_film_v3, contre film_v3.py)
        shell: bash
        run: ./build-physique/physique/essai_film_v3 natif/physique/essais/film_v3_essai

  # T1 (revue 18/11) : toute l'appli PC (Vulkan, interface, essais) se compile pour Windows depuis Linux avec MinGW-w64.
  # Ce n'est pas la chaîne de Marc (llvm-mingw) : une erreur de compilation ici en est une là-bas aussi, l'inverse n'est pas garanti.
  appli-pc-windows:
    name: Appli PC (compilation croisée Windows)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Outils
        shell: bash
        run: sudo apt-get update -qq && sudo apt-get install -y -qq g++-mingw-w64-x86-64-posix ninja-build glslang-tools >/dev/null
      - name: Compiler
        shell: bash
        run: |
          printf '%s\n' 'set(CMAKE_SYSTEM_NAME Windows)' 'set(CMAKE_C_COMPILER x86_64-w64-mingw32-gcc-posix)' \
            'set(CMAKE_CXX_COMPILER x86_64-w64-mingw32-g++-posix)' 'set(CMAKE_RC_COMPILER x86_64-w64-mingw32-windres)' 'set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)' > mingw.cmake
          cmake -S natif -B build-win -G Ninja -DCMAKE_TOOLCHAIN_FILE=$PWD/mingw.cmake -DCMAKE_BUILD_TYPE=Release -Wno-dev
          cmake --build build-win -j 4
