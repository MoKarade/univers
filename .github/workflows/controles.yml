# T1 (mission 1) : chaque proposition de changement construit la page et lance les tests de calcul.
# Commande exigée par docs/mission-lot1.md, reprise telle quelle dans la dernière étape.
name: Contrôles

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Une nouvelle poussée annule le contrôle en cours sur la même branche (minutes comptées).
concurrency:
  group: controles-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  construire-et-tester:
    name: Construire la page et tester les calculs
    runs-on: ubuntu-latest
    # Plafond : sans lui, un contrôle figé tourne six heures.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Construire puis tester
        shell: bash
        run: python3 app/build.py && for f in app/test/*.test.js; do echo "== $f"; node "$f" || exit 1; done
      - name: Plus de fondu daté pour les planètes (R7)
        shell: bash
        run: "! grep -rn FATE_P app/src"

  # T1 (revue 18/11) : la physique native (sans Vulkan ni windows.h) compile et ses essais sans données tournent sous Linux.
  # Les essais qui lisent un film ou DE440 sont seulement compilés : leurs fichiers restent sur le PC de Marc.
  physique-native:
    name: Physique native (compilation et essai des orbites)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compiler
        shell: bash
        run: |
          cmake -S natif/physique -B build-physique -DCMAKE_CXX_STANDARD=20 -DCMAKE_BUILD_TYPE=Release -Wno-dev
          cmake --build build-physique -j 4 --target essai_galaxie essai_fusion essai_champ_bfe essai_film
      - name: Orbites des étoiles (essai_galaxie)
        shell: bash
        run: ./build-physique/essai_galaxie
