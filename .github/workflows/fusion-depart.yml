# A1 (docs/plan-natif.md) : conditions de départ de la fusion, tirées avec AGAMA (qui ne s'installe pas sans
# compilateur sur le PC). Le calcul lui-même tourne ensuite sur la carte graphique du PC (calcul.py --gpu).
# Sortie : depart.npz, gardé 30 jours comme fichier de la tâche.
name: Fusion - conditions de départ

on:
  workflow_dispatch:
    inputs:
      n: { description: "particules en tout", default: "3000000" }
  push:
    branches: ["appli-pc"]
    paths: [".github/workflows/fusion-depart.yml"]

permissions:
  contents: read

jobs:
  depart:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Logiciels (AGAMA)
        run: |
          sudo apt-get install -y -qq libgsl-dev > /dev/null
          python -m pip install --quiet numpy scipy setuptools wheel
          git clone --depth 1 https://github.com/GalacticDynamics-Oxford/Agama.git /tmp/agama
          (cd /tmp/agama && python setup.py install --yes > /tmp/agama.log 2>&1 || (tail -40 /tmp/agama.log; exit 1))
      - name: Tirage
        working-directory: pipeline/fusion
        run: python calcul.py depart "${{ inputs.n || '3000000' }}"
      - uses: actions/upload-artifact@v4
        with: { name: fusion-depart, path: pipeline/fusion/sortie/depart.npz, retention-days: 30 }
