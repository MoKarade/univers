# R8 : essai réduit du calcul de la fusion (docs/fusion-methode.md § 6). Lancé à la main, ou quand pipeline/fusion change.
name: Fusion - essai

on:
  workflow_dispatch:
    inputs:
      n: { description: "particules par galaxie", default: "15000" }
      duree: { description: "durée en milliards d'années", default: "1.0" }
      pas: { description: "pas en millions d'années", default: "1.0" }
  push:
    paths: ["pipeline/fusion/**", ".github/workflows/fusion-essai.yml"]

concurrency:
  group: fusion-essai-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  essai:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Logiciels (AGAMA, pyfalcon)
        run: |
          sudo apt-get install -y -qq libgsl-dev > /dev/null
          python -m pip install --quiet numpy scipy setuptools wheel
          git clone --depth 1 https://github.com/GalacticDynamics-Oxford/Agama.git /tmp/agama
          (cd /tmp/agama && python setup.py install --yes > /tmp/agama.log 2>&1 || (tail -40 /tmp/agama.log; exit 1))
          python -m pip install --no-build-isolation git+https://github.com/GalacticDynamics-Oxford/pyfalcon.git
          python -c "import agama, pyfalcon; print('AGAMA et pyfalcon prêts')"
      - name: Essai
        working-directory: pipeline/fusion
        run: python essai.py "${{ github.event.inputs.n || '15000' }}" "${{ github.event.inputs.duree || '1.0' }}" "${{ github.event.inputs.pas || '1.0' }}"
